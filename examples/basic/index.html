<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1280, height=720" />
    <title>Basic composition</title>
  </head>
  <body>
    <!--
      The composition root: size, fps and duration (seconds; 160 frames at 30 fps).
      data-no-timeline: the animations are CSS and Web Animations, so there is no GSAP
      timeline for HyperFrames to wait for.
    -->
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-width="1280"
      data-height="720"
      data-fps="30"
      data-duration="5.333333"
      data-no-timeline
    ></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
