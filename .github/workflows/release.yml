name: Release

# Push a tag matching the package version (e.g. v0.2.3) to publish it to npm and to GitHub
# Packages (where projects that map the whole @inurun scope to GitHub Packages install it).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      # Trusted publishing (OIDC, configured on npmjs.com): no token, provenance included.
      # prepublishOnly runs `pnpm check`. A version already on npm (e.g. published by hand) is
      # skipped; `npm view` cannot tell, as the registry metadata lags behind a publish.
      - name: Publish to npm
        # `bash` (unlike the default shell) sets pipefail, so a failed publish is not hidden by tee.
        shell: bash
        run: |
          if ! npm publish --provenance --access public 2>&1 | tee publish.log; then
            grep -q "cannot publish over the previously published" publish.log
            echo "Already on npm: skipped."
          fi

  github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@inurun"
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish to GitHub Packages instead of npm
        # publishConfig pins npmjs (also for the scope); drop it for this registry.
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.publishConfig.registry;
            delete pkg.publishConfig["@inurun:registry"];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
