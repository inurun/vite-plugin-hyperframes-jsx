name: Release

# Push a tag matching the package version (e.g. v0.2.3) to publish it to npm and to GitHub
# Packages (where projects that map the whole @inurun scope to GitHub Packages install it).
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm provenance / trusted publishing
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip a version already on npm (e.g. published by hand)
        id: published
        run: |
          # Prints nothing (exit 0) for a version that is not published yet.
          if [ -n "$(npm view "$(node -p 'require("./package.json").name')@${GITHUB_REF_NAME#v}" version 2> /dev/null)" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      # Trusted publishing (OIDC, configured on npmjs.com): no token, provenance included.
      # prepublishOnly runs `pnpm check`.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --provenance --access public

  github-packages:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://npm.pkg.github.com
          scope: "@inurun"
      - run: pnpm install --frozen-lockfile
      - name: Check that the tag matches the package version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Publish to GitHub Packages instead of npm
        # publishConfig pins npmjs (also for the scope); drop it for this registry.
        run: |
          node -e '
            const fs = require("node:fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            delete pkg.publishConfig.registry;
            delete pkg.publishConfig["@inurun:registry"];
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
